services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: raposafm-rabbitmq
    # O RabbitMQ guarda o banco (mnesia) em um diretório por hostname do
    # node. Sem isso fixo, cada recriação do container (docker compose
    # down + up) sorteia um hostname novo e o node "esquece" tudo que
    # tinha antes — mesmo com o volume intacto. Descoberto na prática:
    # 4 bancos órfãos se acumularam no volume ao longo de um único dia
    # de testes, cada um do tamanho de um container recriado.
    hostname: raposafm-rabbitmq
    restart: unless-stopped
    ports:
      - '5672:5672' # AMQP
      - '15672:15672' # Painel de management (http://localhost:15672)
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-raposafm}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?defina RABBITMQ_PASSWORD no seu .env}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  rabbitmq_data:
