services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: raposafm-rabbitmq
    # O RabbitMQ guarda o banco (mnesia) em um diretório por hostname do
    # node. Sem isso fixo, cada recriação do container (docker compose
    # down + up) sorteia um hostname novo e o node "esquece" tudo que
    # tinha antes — mesmo com o volume intacto. Descoberto na prática:
    # 4 bancos órfãos se acumularam no volume ao longo de um único dia
    # de testes, cada um do tamanho de um container recriado.
    hostname: raposafm-rabbitmq
    restart: unless-stopped
    ports:
      - '5672:5672' # AMQP
      - '15672:15672' # Painel de management (http://localhost:15672)
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-raposafm}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?defina RABBITMQ_PASSWORD no seu .env}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build: .
    command: node src/api/server.js
    restart: unless-stopped
    ports:
      - '${API_PORT:-3000}:${API_PORT:-3000}'
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-raposafm}:${RABBITMQ_PASSWORD:?defina RABBITMQ_PASSWORD no seu .env}@rabbitmq:5672
      API_PORT: ${API_PORT:-3000}
      ALLOW_PRIVATE_NETWORK_URLS: ${ALLOW_PRIVATE_NETWORK_URLS:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      rabbitmq:
        condition: service_healthy

  worker:
    build: .
    command: node src/worker/index.js
    restart: unless-stopped
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-raposafm}:${RABBITMQ_PASSWORD:?defina RABBITMQ_PASSWORD no seu .env}@rabbitmq:5672
      WORKER_PREFETCH: ${WORKER_PREFETCH:-10}
      MAX_RETRIES: ${MAX_RETRIES:-5}
      HTTP_TIMEOUT_MS: ${HTTP_TIMEOUT_MS:-5000}
      RETRY_BACKOFF_MS: ${RETRY_BACKOFF_MS:-60000,300000,900000}
      ALLOW_PRIVATE_NETWORK_URLS: ${ALLOW_PRIVATE_NETWORK_URLS:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      rabbitmq:
        condition: service_healthy
    # docker compose up -d --scale worker=3

volumes:
  rabbitmq_data:
